# docker-compose.yml — dev sandbox for the rocksoftware-cakephp-users plugin.
#
# This is NOT a product deployment. The plugin is a library; the container
# is a long-running development workspace to exec into to run composer
# install, phpunit, and code edits against a live DB + Redis. nginx serves a
# placeholder so an HTTP health check passes.
#
# Variables (see .env.example):
#   DB_PASSWORD          (required)
#   DB_ROOT_PASSWORD     (required)
#   DB_NAME              (default: sso)
#   DB_USER              (default: sso)

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_NAME=${DB_NAME:-sso}
      - DB_USER=${DB_USER:-sso}
      - DB_PASSWORD=${DB_PASSWORD}
      - DATABASE_URL=mysql://${DB_USER:-sso}:${DB_PASSWORD}@db:3306/${DB_NAME:-sso}
      - DATABASE_TEST_URL=mysql://${DB_USER:-sso}:${DB_PASSWORD}@db:3306/${DB_NAME:-sso}_test
      - REDIS_URL=redis://redis:6379
    expose:
      - "80"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost/", "-o", "/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  db:
    image: mariadb:11.4
    environment:
      - MARIADB_DATABASE=${DB_NAME:-sso}
      - MARIADB_USER=${DB_USER:-sso}
      - MARIADB_PASSWORD=${DB_PASSWORD}
      - MARIADB_ROOT_PASSWORD=${DB_ROOT_PASSWORD}
    volumes:
      - dbdata:/var/lib/mysql
      - ./docker/db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  dbdata:
  redis_data:
