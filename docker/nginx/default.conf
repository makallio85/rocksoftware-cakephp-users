# nginx vhost — plugin sandbox.
#
# Serves a single placeholder index.php from /var/www/html/webroot so an
# HTTP health check (and curious browsers) gets a 200. The plugin itself has no app to serve — the container is a
# dev workspace, not a deployment.

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name _;
    root /var/www/html/webroot;
    index index.php;

    client_max_body_size 32m;
    client_body_timeout 60s;

    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_read_timeout 60s;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
